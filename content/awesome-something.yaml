# カテゴリは最初に登場する順、カテゴリ内の項目は記載順に表示されます。
# 次の記入例を参考にリストへ追記してください。
# 詳しい仕様は README.md を参照。
#
# items:
#   - id: example-tool
#     name: Example Tool
#     category: アプリケーション
#     description: 日々の作業を少し便利にするツール。
#     websiteUrl: https://example.com/
#     githubUrl: https://github.com/example/example-tool
#     articles:
#       - https://example.com/introduction
#       - title: 使い方の紹介
#         url: https://example.com/guide
#     relatedPosts:
#       - title: このサイトでの紹介記事
#         url: /blog/post/example-tool/
#
# category は自由に指定できます（例: サービス、ライブラリ、フレームワーク、アプリケーション）。
# URL と記事リストは省略できます。id は重複しない英小文字・数字・ハイフンにします。
items:
  - id: tradingagents
    name: TradingAgents
    category: 金融・投資
    description: 複数の AI エージェントが市場分析・投資判断・リスク管理を分担する、研究向けの金融取引フレームワーク。
    githubUrl: https://github.com/TauricResearch/TradingAgents
  - id: librechat
    name: LibreChat
    category: AIチャット
    description: GPT・Claude・Gemini など複数の AI モデルを、一つのインターフェースで切り替えて利用できるチャットアプリ。セルフホストにも対応。
    githubUrl: https://github.com/danny-avila/LibreChat
  - id: hyperframes
    name: HyperFrames
    category: 動画生成
    description: HeyGen が公開するオープンソースの動画生成フレームワーク。HTML・CSS・アニメーションから MP4 動画を生成できる。
    githubUrl: https://github.com/heygen-com/hyperframes
  - id: fincept-terminal
    name: Fincept Terminal
    category: 金融・投資
    description: 市場分析・投資調査・経済データの閲覧をまとめて行える金融ターミナル。
    githubUrl: https://github.com/Fincept-Corporation/FinceptTerminal
  - id: moneyprinterturbo
    name: MoneyPrinterTurbo
    category: 動画生成
    description: テーマやキーワードを指定すると、AI と自動化ワークフローで短編動画をワンクリック生成できるツール。
    githubUrl: https://github.com/harry0703/MoneyPrinterTurbo
  - id: agentic-inbox
    name: Agentic Inbox
    category: メール
    description: Cloudflare Workers 上で動作する、AI エージェント搭載のセルフホスト型メールクライアント。受信メールの確認・会話の検索・返信の下書きを支援する。
    githubUrl: https://github.com/cloudflare/agentic-inbox
  - id: voxcpm
    name: VoxCPM
    category: 音声生成
    description: テキストからの音声合成と、参照音声を使った声のクローニングに対応する AI 音声生成モデル。
    githubUrl: https://github.com/OpenBMB/VoxCPM
  - id: flowsint
    name: Flowsint
    category: OSINT
    description: 公開情報を収集・分析し、対象間の関係をグラフで可視化できる OSINT 調査ツール。
    githubUrl: https://github.com/reconurge/flowsint
  - id: agent-skills
    name: agent-skills
    category: 開発ツール
    description: Claude Code などの AI コーディングエージェント向けスキル集。設計・実装・テスト・レビューなど、開発工程の手順やベストプラクティスをまとめている。
    githubUrl: https://github.com/addyosmani/agent-skills
  - id: spec-kit
    name: Spec Kit
    category: 開発ツール
    description: GitHub が公開する仕様駆動開発のためのツールキット。AI コーディングエージェントと連携し、仕様作成・実装計画・タスク分解・実装を段階的に進められる。
    githubUrl: https://github.com/github/spec-kit
    relatedPosts:
      - title: 仕様駆動開発について調べてみた
        url: /blog/post/2025-11-16-spec-driven-development/
  - id: nango
    name: Nango
    category: API連携
    description: 外部サービスとの API 連携を構築・運用するためのプラットフォーム。認証・トークン更新・データ同期などを支援する。
    githubUrl: https://github.com/NangoHQ/nango

  # LLM 永続メモリランドスケープ調査（2026-09-12）をもとに追加。
  - id: claude-mem
    name: Grok Mem（旧 Claude-Mem）
    category: AIメモリ
    description: コーディングエージェントの作業を自動記録・要約し、編集内容や設計判断を次のセッションへ引き継ぐ永続メモリ。
    githubUrl: https://github.com/thedotmack/claude-mem
  - id: mem0
    name: Mem0
    category: AIメモリ
    description: 会話やイベントから事実・好みを抽出し、ユーザーやエージェントごとに追加・検索・更新・削除できるメモリ基盤。
    githubUrl: https://github.com/mem0ai/mem0
  - id: openviking
    name: OpenViking
    category: AIメモリ
    description: 文書・会話・記憶・スキルを仮想ファイルシステムにまとめるコンテキストデータベース。階層的な要約と検索で必要な情報を取り出す。
    githubUrl: https://github.com/volcengine/OpenViking
  - id: graphiti
    name: Graphiti（Zep）
    category: AIメモリ
    description: 会話やイベントから時間情報付きの知識グラフを構築するライブラリ。事実の変化と出典を保持し、意味検索・キーワード検索・関係探索を組み合わせる。
    githubUrl: https://github.com/getzep/graphiti
  - id: cognee
    name: Cognee
    category: AIメモリ
    description: 文書・コード・会話を知識グラフとベクトル索引へ変換し、エージェントがセッションを越えて検索・再利用できるメモリ基盤。
    githubUrl: https://github.com/topoteretes/cognee
  - id: supermemory
    name: Supermemory
    category: AIメモリ
    description: 会話・URL・ファイルから事実やユーザープロファイルを構築し、複数のアプリやエージェントへ検索可能な長期コンテキストを提供する。
    githubUrl: https://github.com/supermemoryai/supermemory
  - id: agentmemory
    name: agentmemory
    category: AIメモリ
    description: 複数のコーディングエージェントの編集・コマンド・判断を取り込み、圧縮して共有するメモリサーバー。MCP や REST API から利用できる。
    githubUrl: https://github.com/rohitg00/agentmemory
  - id: tencentdb-agent-memory
    name: TencentDB Agent Memory
    category: AIメモリ
    description: 会話記憶・スキル・Wiki・CodeGraph をチームの共有資産として管理するメモリ基盤。権限やバージョンを管理し、エージェントごとに必要な知識を提供する。
    githubUrl: https://github.com/TencentCloud/TencentDB-Agent-Memory
  - id: letta
    name: Letta / MemGPT
    category: AIメモリ
    description: エージェントが記憶やスキルを自ら更新し、複数セッションにわたって状態を維持する基盤。MemGPT の系譜を継ぎ、現行実装は Letta Code として公開。
    githubUrl: https://github.com/letta-ai/letta-code
    articles:
      - title: MemGPT 論文
        url: https://arxiv.org/abs/2310.08560
      - title: Letta の旧リポジトリと移転案内
        url: https://github.com/letta-ai/letta
  - id: hindsight
    name: Hindsight
    category: AIメモリ
    description: 観測の保持・想起・内省を通じて、経験から事実や信念を更新するエージェントメモリ。ユーザーやエージェントごとの記憶領域を管理できる。
    githubUrl: https://github.com/vectorize-io/hindsight
  - id: context-mode
    name: Context Mode
